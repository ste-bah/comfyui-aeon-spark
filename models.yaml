# =============================================================================
# models.yaml — model manifest for download_models.py
# =============================================================================
# Each entry:
#   repo:      HF repo id
#   file:      path inside the repo
#   dest:      subdir under <workspace>/models/ (may be nested)
#   name:      human label for logs
#   size_gb:   approximate download size (used for the preflight disk check;
#              exact size is verified against HF metadata after download)
#   precision: bf16 | fp8 | nvfp4 | misc   (misc = only variant / always kept)
#   group:     logical bundle, selectable per profile
#   rename:    optional — save under this filename instead of the HF basename
#   gated:     optional — requires an accepted HF licence + HF_TOKEN
#   link_of:   optional — do NOT download; hardlink to another entry's output,
#              given as "<dest>/<filename>". Saves disk + bandwidth for files
#              that workflows expect under two names.
#
# Profiles (select with MODEL_PROFILE env or --profile):
#   legacy  : exact parity with the original 35-item download set (default)
#   spark   : DGX Spark optimal — NVFP4/FP8 first, no BF16 twins, adds the
#             2026 image models (Z-Image-Turbo, Qwen-Image family)
#   latest  : legacy + the 2026 additions, all precisions
#   minimal : one model per modality, smallest sensible footprint
#
# Groups can be added/removed on top of a profile:
#   MODEL_GROUPS="+wan-video,-ace-audio"   (or --groups)
# =============================================================================

schema: 1

profiles:
  legacy:
    groups: [flux2-image, flux2-klein, ltx-video, ace-audio, abliterated]
    exclude_precisions: []
  spark:
    groups: [flux2-image, flux2-klein, ltx-video, ace-audio, z-image, qwen-image]
    exclude_precisions: [bf16]
  latest:
    groups: [flux2-image, flux2-klein, ltx-video, ace-audio, abliterated, z-image, qwen-image]
    exclude_precisions: []
  minimal:
    groups: [z-image, ace-audio]
    exclude_precisions: [bf16]

